name: CI

on:
  push:
    branches: [main, claude/new-session-1fphb2]
  pull_request:
  # Von Hand ausloesbar, damit ein Deploy auch ohne Codeaenderung geht —
  # etwa wenn nur der Server nachziehen soll.
  #
  # Achtung beim Ausloesen: GitHub belegt die Branch-Auswahl mit dem
  # Default-Branch des Repos vor, und der ist noch der alte Arbeitsbranch.
  # Der Deploy-Job laeuft nur auf main, also dort main waehlen. Sonst
  # laufen die Pruefungen, der Deploy-Job wird uebersprungen.
  workflow_dispatch:

# Ein überholter Lauf auf demselben Branch wird abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typen, Daten, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Kein `cache: npm`: setup-node bricht ohne Lockfile ab, und zwar
      # bevor der Fallback unten greift. Sobald package-lock.json im Repo
      # liegt, `cache: npm` hier wieder ergaenzen — dann spart es Zeit.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `npm ci` braucht ebenfalls ein Lockfile. Solange keines committet
      # ist, greift `npm install` — sonst wäre der erste Lauf rot, ohne dass
      # etwas kaputt ist. Sobald das Lockfile da ist, gilt automatisch der
      # reproduzierbare Pfad.
      - name: Abhängigkeiten
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::Kein package-lock.json im Repo — es läuft 'npm install' statt 'npm ci'. Lockfile committen für reproduzierbare Builds."
            npm install --no-audit --no-fund
          fi

      # Erzeugt .astro/types.d.ts für die Content-Collections; ohne das
      # kennt astro check die Typen der Datenfiles nicht.
      - name: Astro sync
        run: npx astro sync

      - name: Astro check
        run: npm run check

      - name: Endpoint-Syntax
        run: npm run check:php

      # Der Endpoint ist der einzige Teil mit echter Logik. 19 Fälle gegen
      # PHPs eingebauten Server: Validierung, Honeypot, Double-Opt-In,
      # Replay-Schutz, gefälschte Signatur, Rate-Limit, Locale-Zuordnung.
      - name: Endpoint-Verhalten
        run: npm run test:endpoint

      # Prüft die zugesagten Projektfakten: 300 Mietwohnungen, 17 Baubereiche,
      # 3–8 Vollgeschosse, autofrei, keine Mietpreise, kein Vermietungsstart.
      # Bricht ab, wenn eine davon verletzt wird.
      - name: Projektfakten
        run: npm run check:data

      # Die woff2 ist gitignored, muss aber ins Artefakt: sonst zeigt
      # fonts/readex-pro.css auf eine 404 und der Browser faellt still auf
      # system-ui zurueck. Tolerant, weil Google Fonts ein externer Dienst
      # ist und den Lauf nicht roeten soll — die Pruefung unten macht ein
      # unvollstaendiges Artefakt aber sichtbar.
      - name: Schriften für das Artefakt
        id: artifact_fonts
        continue-on-error: true
        run: npm run fonts

      - name: Build
        run: npm run build

      - name: Ausgabe prüfen
        run: |
          test -f dist/index.html
          test -f dist/en/index.html
          test -f dist/robots.txt
          # Genau die Pfade, auf die ErrorDocument in der .htaccess zeigt.
          test -f dist/404.html
          test -f dist/en/404/index.html
          test -f dist/.htaccess
          test -f dist/api/anmeldung.php
          test -f dist/api/liste.php
          # Die @font-face-Regel liegt in public/ und muss mitkommen.
          test -f dist/fonts/readex-pro.css
          # Die Schriftdatei selbst entscheidet, ob das Artefakt direkt
          # hochladbar ist. Fehlt sie, ist der Lauf nicht falsch — aber das
          # Artefakt taugt nicht zum Deployen, und das muss man sehen.
          if [ -s dist/fonts/readex-pro-variable.woff2 ]; then
            echo "Schriftdatei im Artefakt: $(du -h dist/fonts/readex-pro-variable.woff2 | cut -f1)"
          else
            echo "::warning title=Artefakt ohne Schriftdatei::\
            readex-pro-variable.woff2 fehlt — dieses dist/ nicht direkt \
            deployen, sonst laeuft die Site auf system-ui. Ursache: der \
            Schritt 'Schriften für das Artefakt' ist fehlgeschlagen."
          fi
          # Punkt-Dateien sichtbar machen. test -f oben prueft das
          # Build-Verzeichnis; verworfen werden sie erst beim Verpacken
          # (upload-artifact laesst sie ohne include-hidden-files weg). Wer
          # den Upload-Schritt aendert, sieht hier, was ueberleben muss.
          echo "Punkt-Dateien, die ins Artefakt muessen:"
          find dist -name '.*' -type f | sort
          # Der Canonical muss auf die Adresse zeigen, die 200 liefert.
          # Am 24.08.2026 wurde die bevorzugte Domain serverseitig auf
          # birkenhain.ch ohne www umgestellt; der Build setzte weiter www,
          # also zeigten canonical, hreflang und og:url auf eine 301 — und
          # kein Check hat es gemerkt. Dieser hier merkt es.
          ORIGIN="${SITE_ORIGIN:-https://birkenhain.ch}"
          CANON=$(grep -o 'rel="canonical" href="[^"]*"' dist/index.html \
                  | head -1 | sed 's/.*href="//;s/"$//')
          echo "Canonical der Startseite: $CANON"
          if [ "$CANON" != "$ORIGIN/" ]; then
            echo "::error title=Canonical zeigt woandershin::erwartet $ORIGIN/, gefunden $CANON"
            exit 1
          fi
          if grep -rq --include='*.html' 'https://www\.birkenhain\.ch' dist; then
            echo "::error title=www im Build::www.birkenhain.ch leitet per 301 um — canonical, hreflang und og:url duerfen nicht darauf zeigen."
            grep -rl --include='*.html' 'https://www\.birkenhain\.ch' dist
            exit 1
          fi
          # Das Vorschaubild fuer geteilte Links. Es entsteht zur Buildzeit
          # aus arrival.jpg; faellt getImage aus oder verschwindet das Tag,
          # zeigt jeder geteilte Link wieder kein Bild — und das sieht man
          # erst, wenn jemand teilt.
          OG=$(grep -o 'property="og:image" content="[^"]*"' dist/index.html \
               | head -1 | sed 's/.*content="//;s/"$//')
          echo "og:image der Startseite: $OG"
          case "$OG" in
            "$ORIGIN"/*.jpg) ;;
            *) echo "::error title=og:image fehlt oder ist relativ::erwartet eine absolute URL unter $ORIGIN, gefunden '$OG'"
               exit 1 ;;
          esac
          # Die Datei muss auch wirklich im Artefakt liegen, nicht nur im Tag.
          OG_PFAD="dist${OG#"$ORIGIN"}"
          if [ ! -s "$OG_PFAD" ]; then
            echo "::error title=og:image zeigt ins Leere::$OG_PFAD fehlt im Build"
            exit 1
          fi
          echo "og:image im Artefakt: $(du -h "$OG_PFAD" | cut -f1)"
          # Skripte muessen Dateien sein, keine Inline-Bloecke: die .htaccess
          # setzt script-src 'self' ohne unsafe-inline, ohne Nonce, ohne Hash.
          # Ein Inline-Skript weist der Browser ab — und still: die Seite
          # rendert, nur reagiert nichts von ihr. Genau so lag die Site live,
          # waehrend jede Pruefung gruen war.
          npm run check:csp
          # Strukturierte Daten: nur die Startseite, und valides JSON.
          LD=$(grep -c 'application/ld+json' dist/index.html || true)
          if [ "$LD" != "1" ]; then
            echo "::error title=JSON-LD auf der Startseite::erwartet genau 1 Block, gefunden $LD"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('dist/index.html', 'utf8');
            const m = html.match(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/);
            if (!m) { console.error('::error title=JSON-LD nicht lesbar::Block nicht gefunden'); process.exit(1); }
            const d = JSON.parse(m[1]);
            const soll = JSON.parse(fs.readFileSync('src/data/projekt.json', 'utf8')).wohnungen;
            if (d.numberOfAccommodationUnits?.value !== soll) {
              console.error('::error title=JSON-LD widerspricht projekt.json::' + d.numberOfAccommodationUnits?.value + ' statt ' + soll);
              process.exit(1);
            }
            console.log('JSON-LD: ' + d['@type'] + ', ' + soll + ' Wohnungen, ' + d.address.addressLocality);
          "
          echo "Erzeugte Seiten:"
          find dist -name '*.html' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # upload-artifact@v4 laesst Punkt-Dateien sonst weg - die gebaute
          # .htaccess landet dann nie im Artefakt.
          include-hidden-files: true
          retention-days: 7

  fonts:
    name: Schriften abrufbar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Nur dieser Schritt darf scheitern, ohne den PR zu blockieren:
      # Google Fonts ist ein externer Dienst. `continue-on-error` gehoert
      # deshalb hierhin und nicht an den Job — job-weit wuerde es auch die
      # Pruefung unten verschlucken und einen echten Fehler gruen melden.
      - name: Readex Pro holen
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-fonts.mjs

      # Ein Dedup-Fehler dagegen muss den Lauf roeten — also ohne
      # continue-on-error, und nur wenn der Download ueberhaupt klappte.
      - name: Schnitte prüfen
        if: steps.fetch.outcome == 'success'
        run: |
          ls -la public/fonts/
          test -s public/fonts/readex-pro-variable.woff2
          # Identische Checksummen heissen: dieselbe Datei mehrfach geladen.
          # Genau das war der Fehler, den diese Prüfung fernhalten soll.
          dupes=$(sha256sum public/fonts/*.woff2 | awk '{print $1}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Mehrere woff2-Dateien sind byte-identisch — Deduplizierung im Font-Skript kaputt."
            sha256sum public/fonts/*.woff2
            exit 1
          fi

  subpath:
    name: Build unter Unterpfad
    runs-on: ubuntu-latest
    # Beweist die Basispfad-Unterstützung, ohne von GitHub Pages abzuhängen.
    # Der Pages-Workflow kann erst laufen, wenn Pages von Hand eingeschaltet
    # ist — diese Prüfung soll bis dahin nicht ausfallen.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Abhängigkeiten
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Build mit Basispfad
        run: npm run build
        env:
          SITE_ORIGIN: https://example.invalid
          SITE_BASE: /unterpfad
          STATIC_PREVIEW: 'true'

      - name: Pfade prüfen
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # Navigation, Schrift-Stylesheet, Preload und Formular müssen den
          # Basispfad tragen — das sind die vier Stellen, die vorher absolut
          # verdrahtet waren.
          grep -q 'href="/unterpfad/architektur/"' dist/index.html \
            || fail "Navigation ohne Basispfad oder ohne Slash"
          grep -q 'href="/unterpfad/fonts/readex-pro.css"' dist/index.html \
            || fail "Schrift-Stylesheet ohne Basispfad"
          grep -q 'href="/unterpfad/fonts/readex-pro-variable.woff2"' dist/index.html \
            || fail "Font-Preload ohne Basispfad"
          grep -q 'action="/unterpfad/api/anmeldung.php"' dist/anmeldung/index.html \
            || fail "Formular-Action ohne Basispfad"
          grep -q 'href="/unterpfad/en/architecture/"' dist/en/index.html \
            || fail "Sprachumschalter ohne Basispfad oder ohne Slash"

          # Die @font-face-URL muss geschwister-relativ bleiben, sonst zeigt
          # sie unter einem Unterpfad ins Leere.
          grep -q "url('readex-pro-variable.woff2')" dist/fonts/readex-pro.css \
            || fail "@font-face-URL ist nicht geschwister-relativ"

          # Kein absoluter Rest-Pfad in der Navigation. Als if geschrieben,
          # weil `grep -q X && fail` von der set-e-Semantik fuer AND-Listen
          # abhaengt — sie greift hier, aber lesbar ist das nicht.
          if grep -qE 'href="/architektur/?"' dist/index.html; then
            fail "absoluter Pfad ohne Basispfad übrig geblieben"
          fi

          # Vorschau muss sich als solche zeigen und gesperrt sein.
          grep -q 'name="robots" content="noindex' dist/index.html \
            || fail "Vorschau ohne noindex"
          grep -q 'Disallow: /' dist/robots.txt \
            || fail "robots.txt sperrt die Vorschau nicht"
          grep -qi 'Vorschau' dist/index.html \
            || fail "Vorschau-Hinweis fehlt"
          grep -q 'data-submit disabled' dist/anmeldung/index.html \
            || grep -q 'disabled data-submit' dist/anmeldung/index.html \
            || fail "Absende-Knopf in der statischen Vorschau nicht gesperrt"

          echo "Basispfad, Vorschau-Hinweis und Sperren in Ordnung."

  deploy-branch:
    name: Deploy-Branch aktualisieren
    runs-on: ubuntu-latest
    # Nur beim Push auf main, nie von einem Pull Request.
    #
    # Vorher hing die Bedingung am Default-Branch des Repos. Das war richtig,
    # solange die Arbeit auf dem Arbeitsbranch lag und main leer war. Seit dem
    # Merge von #1 ist main die Wahrheit — der Default zeigt aber weiter auf
    # den Arbeitsbranch, der keine Pushes mehr bekommt. Die Kopplung haette
    # jeden Push auf main uebersprungen und der Deploy-Branch waere still
    # stehengeblieben: gruener Lauf, alter Stand live.
    #
    # Eine feste Quelle, nicht zwei — zwei waeren ein Wettlauf um denselben
    # Branch mit force-push.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == 'main'
    needs: [build, subpath]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Abhängigkeiten
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Schriften
        run: npm run fonts

      - name: Build
        run: npm run build

      # Der Branch traegt ausschliesslich den Inhalt von dist/ — genau das,
      # was ins Webroot gehoert. Plesks Git-Extension kann ihn direkt dorthin
      # ziehen, ohne Node auf dem Server und ohne Zip-Hantieren.
      #
      # Jeder Build committet auf den bestehenden Deploy-Branch, statt ihn als
      # --orphan neu zu wurzeln und force-zu-pushen. Das war der Grund, warum
      # die Website nach dem ersten Klon nie wieder aktuell wurde: Plesk zieht
      # mit einem Merge, und zwei Wurzel-Commits haben keine gemeinsame
      # Historie ("refusing to merge unrelated histories"). Der Lauf blieb
      # gruen, der Branch wurde geschrieben — und der Server kam nicht mehr
      # mit. Ein Fast-Forward kann Plesk ziehen.
      #
      # Das Repo waechst dadurch nur um das, was sich wirklich aendert:
      # Astro haengt den Inhalts-Hash an die Asset-Namen, ein unveraendertes
      # Bild bleibt also derselbe Blob.
      - name: dist/ auf den Deploy-Branch schreiben
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/api/anmeldung.php
          test -s dist/fonts/readex-pro-variable.woff2

          SRC_SHA="$(git rev-parse HEAD)"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          cd dist

          # Nebenlaeufige Laeufe: wer verliert, setzt auf dem neuen Stand neu
          # auf. Kein force-push — ein fremder Build soll nicht verschwinden.
          pushed=""
          for versuch in 1 2 3; do
            rm -rf .git
            git init -q
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git checkout -q -b deploy

            # Nur die Spitze holen; der Push braucht die Historie nicht, die
            # Gegenseite hat sie. Beim allerersten Lauf gibt es sie noch nicht.
            if git fetch -q --depth=1 "${REMOTE}" deploy 2>/dev/null; then
              git reset -q --soft FETCH_HEAD
            fi

            git add -A
            # --allow-empty: ein Build ohne Aenderung ist kein Fehler.
            git commit -q --allow-empty -m "Build von ${SRC_SHA}

          Erzeugt aus ${GITHUB_REF_NAME} durch .github/workflows/ci.yml.
          Dieser Branch enthaelt nur Build-Ergebnis, keinen Quellcode —
          nicht hier committen, Aenderungen gehoeren in den Quellbranch."

            if git push -q "${REMOTE}" deploy; then
              pushed="ja"
              break
            fi
            echo "::warning::Deploy-Branch wurde nebenlaeufig geschrieben, Versuch ${versuch} setzt neu auf."
            sleep 5
          done

          test -n "${pushed}"
          echo "::notice::Deploy-Branch aktualisiert auf Basis von ${SRC_SHA}"

      # Der letzte Meter: Plesk zieht den Branch nicht von selbst. Bisher
      # hing er an einem Klick im Git-Modul, und genau dort blieb die
      # Website mehrfach stehen — gruener Lauf, geschriebener Branch, alter
      # Stand live. Dasselbe Muster wie beim Orphan-Commit, nur eine Stufe
      # weiter aussen.
      #
      # Liegt das Secret PLESK_DEPLOY_HOOK, ruft dieser Schritt die
      # Webhook-URL aus dem Plesk-Git-Modul auf und der Server holt sich den
      # neuen Stand. Ohne Secret wird der Schritt uebersprungen; der Lauf
      # bleibt gruen, sagt aber im Log, dass der Deploy an dieser Stelle
      # endet.
      #
      # Die URL traegt ein Token und wird nie ausgegeben — weder bei Erfolg
      # noch im Fehlerfall. Antwortet Plesk nicht mit 2xx, faellt der Job:
      # ein Deploy, der nicht deployt, soll nicht wie ein Deploy aussehen.
      - name: Plesk anstossen
        env:
          HOOK: ${{ secrets.PLESK_DEPLOY_HOOK }}
        run: |
          if [ -z "${HOOK}" ]; then
            echo "::notice::Kein PLESK_DEPLOY_HOOK gesetzt — der Server muss den Branch selbst ziehen."
            exit 0
          fi

          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST --max-time 60 "${HOOK}" || echo 000)"
          case "${code}" in
            2??) echo "::notice::Plesk angestossen, HTTP ${code}" ;;
            000) echo "::error::Plesk-Webhook nicht erreichbar (Verbindung fehlgeschlagen)."; exit 1 ;;
            *)   echo "::error::Plesk-Webhook antwortete HTTP ${code}."; exit 1 ;;
          esac
